name: Coverage-v8 non-file URL — cross-OS behavior matrix
on:
  push:
    branches: [rsc-poc-repro]
  workflow_dispatch:

jobs:
  reproduce:
    name: crash on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run RSC component tests
        id: rsc
        continue-on-error: true
        run: npm run test:component:rsc

      - name: Verify platform behavior matches expectations
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              expected="failure"   # Windows: fileURLToPath throws ERR_INVALID_FILE_URL_PATH
              label="hard crash"
              ;;
            *)
              expected="success"   # POSIX: fileURLToPath returns garbage silently, run exits 0
              label="silent misroute (no crash)"
              ;;
          esac
          actual="${{ steps.rsc.outcome }}"
          echo "OS=${{ matrix.os }}  expected=$expected  actual=$actual  behavior=\"$label\""
          if [ "$actual" != "$expected" ]; then
            echo "::error::Platform behavior deviated from documented expectation for ${{ matrix.os }}."
            exit 1
          fi
